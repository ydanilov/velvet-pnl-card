<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet PNL Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07020f; --panel:#120a22; --panel2:#1a1030; --line:#2c1f47; --text:#fdfbff; --muted:#9390ac;
  --accent:#9d58f4; --accent2:#be82f3; --green:#04f26c; --red:#ff4d6a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:13px}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto 1fr;align-items:start;gap:16px;padding:16px;min-height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.top h1{font:600 16px Poppins,sans-serif;margin:0;letter-spacing:.2px}
.top .src{margin-left:auto;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--green);box-shadow:0 0 10px var(--green)}
.dot.demo{background:#ffb13d}
.stage{position:relative;background:#050109;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:14px;min-width:0}
.stage canvas{width:100%;height:auto;max-height:calc(100vh - 300px);object-fit:contain;display:block;border-radius:6px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,1,9,.7);font:500 14px Poppins;border-radius:14px}
.loading[hidden]{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.lbl{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;align-items:center}
.field>label b{color:var(--text);font-weight:600}
select,input[type=number],input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;outline:none}
select:focus,input:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px 0;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.row{display:flex;gap:8px;align-items:center}
.row input[type=number]{width:78px;flex:none}
input[type=range]{flex:1;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,#9d58f4,#6a2ee0);border-color:transparent}
.btn.rec{background:linear-gradient(135deg,#ff4d6a,#d62a6b);border-color:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.hint{color:var(--muted);font-size:11px;line-height:1.45}
.userbar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.userbar .seg{max-width:420px}
.debugHead{font:600 13px Poppins,sans-serif;display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.debugHead span{font:500 11px Inter,sans-serif;color:var(--muted)}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}
.editor{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.editor .play{width:36px;height:36px}
.editor .scrub{min-width:0;gap:8px}.editor .scrub input{min-width:0}.editor .scrub span{min-width:0;white-space:nowrap;font-size:11px}
.play{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center}
.play svg{width:18px;height:18px;fill:#fff}
.scrub{display:flex;align-items:center;gap:10px}
.scrub span{color:var(--muted);font-variant-numeric:tabular-nums;min-width:92px;text-align:right}
.rangeWrap{grid-column:1/-1}
.rangeHead{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:11px;line-height:1.4}
.rangeHead b{color:var(--text);font-weight:600;font-size:12px}
.rangeHead b{color:var(--text);font-weight:600}
.track{position:relative;height:80px;border-radius:10px;background:#0b0616;border:1px solid var(--line);overflow:hidden;touch-action:none;user-select:none}
.track canvas{position:absolute;inset:0;width:100%;height:100%}
.dim{position:absolute;top:0;bottom:0;background:rgba(5,1,9,.72);pointer-events:none}
.win{position:absolute;top:0;bottom:0;border:2px solid var(--accent);border-radius:8px;cursor:grab;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 24px rgba(157,88,244,.35) inset}
.win:active{cursor:grabbing}
.h{position:absolute;top:-2px;bottom:-2px;width:12px;background:var(--accent);cursor:ew-resize;display:flex;align-items:center;justify-content:center}
.h::after{content:"";width:2px;height:22px;border-radius:2px;background:rgba(255,255,255,.8)}
.h.l{left:-2px;border-radius:8px 0 0 8px}
.h.r{right:-2px;border-radius:0 8px 8px 0}
@media (max-width:900px){.app{grid-template-columns:1fr}.stage canvas{max-height:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Velvet · Dynamic PNL card</h1>
    <div class="src"><span class="dot" id="srcDot"></span><span id="srcText">Loading…</span></div>
  </div>

  <div class="left">
  <section class="stage">
    <canvas id="cv" width="1628" height="1116"></canvas>
    <div class="loading" id="loading">Loading prices…</div>
  </section>
  <section class="userbar">
    <div class="field periodField grow">
      <label>Period</label>
      <div class="track" id="track">
        <canvas id="spark"></canvas>
        <div class="dim" id="dimL"></div><div class="dim" id="dimR"></div>
        <div class="win" id="win"><div class="h l" id="hL"></div><div class="h r" id="hR"></div></div>
      </div>
      <div class="rangeHead"><b id="rangeText">—</b><span id="rangeMeta"></span></div>
    </div>
    <div class="field">
      <label>Timeline</label>
      <div class="seg" id="tl">
        <button data-v="30D">30D · 5m</button><button data-v="1Y" class="on">1Y · 1h</button><button data-v="5Y">5Y · 1d</button>
      </div>
    </div>
  </section>
  </div>

  <aside class="panel">
    <div class="debugHead">Debug settings <span>not visible to users</span></div>
    <section class="editor">
    <button class="play" id="playBtn" title="Play / pause"><svg id="playIco" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></button>
    <div class="scrub"><input type="range" id="scrub" min="0" max="1000" value="0"><span id="timeLbl">0.0 / 10.0s</span></div>
  </section>
    <div class="field">
      <label>Token</label>
      <select id="token"></select>
    </div>
    <div class="field">
      <label>Candles on screen <b id="candlesInfo"></b></label>
      <div class="row"><input type="range" id="candlesR" min="20" max="300" step="1" value="35"><input type="number" id="candles" min="20" max="300" value="35"></div>
    </div>
    <div class="field">
      <label>Video length, sec</label>
      <div class="row"><input type="range" id="durR" min="3" max="30" step="0.5" value="8"><input type="number" id="dur" min="3" max="60" step="0.5" value="8"></div>
    </div>
    <div class="field">
      <label>Trades in history (swings)</label>
      <div class="row"><input type="range" id="tradesR" min="4" max="120" step="1" value="30"><input type="number" id="trades" min="4" max="120" value="30"></div>
    </div>
    <div class="field">
      <label>Candle height boost</label>
      <div class="row"><input type="range" id="boostR" min="1" max="3" step="0.1" value="1.6"><input type="number" id="boost" min="1" max="3" step="0.1" value="1.6"></div>
      <div class="hint">OHLC stays real — only the drawn body/wick is stretched around its midpoint so candles always look tall.</div>
    </div>
    <div class="field">
      <label>Invested capital, $</label>
      <input type="number" id="capital" min="100" step="100" value="10000">
    </div>
    <div class="field">
      <label>Loop preview</label>
      <div class="seg" id="loop"><button data-v="1" class="on">On</button><button data-v="0">Off</button></div>
    </div>
    <button class="btn rec" id="exportBtn">● Export video</button>
    <div class="hint" id="exportHint">Records the canvas in real time (MP4 in Chrome/Safari, WebM elsewhere).</div>
  </aside>

</div>

<script>
(() => {
'use strict';
// ---------- assets ----------
const ASSETS = { bg: '{{BG}}', gift: '{{GIFT}}', logo: '{{LOGO}}', eth: '{{ETH}}' };
const IMG = {};
function loadImg(k){ return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = ASSETS[k]; IMG[k] = i; }); }

// ---------- constants (Figma frame 1628×1116) ----------
const W = 1628, H = 1116;
const CARD = { x: 40, y: 40, w: 1548, h: 870, r: 30 };
const CHART = { x: 95, y: 282, w: 1468, h: 372 };
const ARROW = { x: CARD.x + 1137, y: CARD.y + 300 };
const C = { green: '#04f26c', red: '#ff4d6a', white: '#fdfbff', muted: '#9390ac', purple: '#9d58f4', lilac: '#be82f3', dark: '#0e081c' };

const TOKENS = [
  { s: 'ETH', c: '#627eea', p: 3200 }, { s: 'BTC', c: '#f7931a', p: 90000 }, { s: 'SOL', c: '#9945ff', p: 180 },
  { s: 'BNB', c: '#f3ba2f', p: 650 }, { s: 'XRP', c: '#23292f', p: 2.4 }, { s: 'DOGE', c: '#c2a633', p: 0.2 },
  { s: 'PEPE', c: '#3d9c36', p: 0.00001 }, { s: 'LINK', c: '#2a5ada', p: 18 }, { s: 'AVAX', c: '#e84142', p: 30 },
  { s: 'SUI', c: '#4da2ff', p: 3.5 }, { s: 'TON', c: '#0098ea', p: 5 }, { s: 'ARB', c: '#28a0f0', p: 0.8 }
];
const TL = {
  '30D': { iv: '5m', ms: 3e5, days: 30, cc: 'histohour', ccMs: 36e5, def: 1 },
  '1Y':  { iv: '1h', ms: 36e5, days: 365, cc: 'histohour', ccMs: 36e5, def: 1 },
  '5Y':  { iv: '1d', ms: 864e5, days: 1825, cc: 'histoday', ccMs: 864e5, def: 0.4 }
};

// ---------- state ----------
const S = {
  token: 'ETH', tl: '1Y', N: 35, D: 8, trades: 30, boost: 1.6, capital: 10000, loop: true,
  base: [], src: '', range: [0, 0], model: null,
  playing: true, startAt: 0, pausedT: 0, recording: false
};
const cache = {};

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const eOutCubic = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const eOutQuart = t => 1 - Math.pow(1 - clamp(t, 0, 1), 4);
const eOutBack = (t, s = 1.9) => { t = clamp(t, 0, 1) - 1; return t * t * ((s + 1) * t + s) + 1; };
const eOutElastic = t => { t = clamp(t, 0, 1); if (t === 0 || t === 1) return t; return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1; };
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hexToRgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(h1, h2, t){ const a = hexToRgb(h1), b = hexToRgb(h2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',')})`; }
function rgba(h, a){ const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }

function fmtPrice(p){
  if (!isFinite(p) || p === 0) return '$0';
  if (p >= 1000) return '$' + Math.round(p).toLocaleString('en-US');
  if (p >= 1) return '$' + p.toFixed(2);
  const d = Math.min(10, Math.max(3, -Math.floor(Math.log10(p)) + 2));
  return '$' + p.toFixed(d);
}
function fmtCompact(v, pre = '$'){
  // thousands → 4.2K, millions → 1.3M (one decimal below 100, trailing .0 dropped)
  const a = Math.abs(v), sgn = v < 0 ? '-' : '';
  const f = (x, u) => sgn + pre + (x >= 100 ? Math.floor(x) : (Math.floor(x * 10 + 1e-9) / 10).toString()) + u;
  if (a >= 1e9) return f(a / 1e9, 'B');
  if (a >= 1e6) return f(a / 1e6, 'M');
  if (a >= 1e3) return f(a / 1e3, 'K');
  return sgn + pre + Math.round(a);
}
function fmtTilePrice(p){ return Math.abs(p) >= 1000 ? fmtCompact(p) : fmtPrice(p); }
function fmtQty(q){
  if (q <= 0) return '0';
  if (q >= 1e5) return fmtCompact(q, '').replace(/\.\d+/, '');
  return Math.round(q).toLocaleString('en-US');
}
function fmtUsd(v){
  const a = Math.abs(v);
  return '$' + (a < 100 ? a.toFixed(2) : Math.round(a).toLocaleString('en-US'));
}
function fmtPct(p){
  const a = Math.abs(p);
  const s = Math.round(a).toLocaleString('en-US');
  return (p < 0 ? '-' : '') + s + '%';
}
function fmtDate(t, withTime){
  const d = new Date(t);
  const o = { day: 'numeric', month: 'short', year: 'numeric' };
  if (withTime) { o.hour = '2-digit'; o.minute = '2-digit'; }
  return d.toLocaleString('en-GB', o);
}

// ---------- data ----------
async function fetchJSON(url){ const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
async function fromBinance(host, sym, tl){
  const cfg = TL[tl], end = Date.now(), start = end - cfg.days * 864e5, step = 1000 * cfg.ms;
  const jobs = [];
  for (let s = start; s < end; s += step)
    jobs.push(fetchJSON(`${host}/api/v3/klines?symbol=${sym}USDT&interval=${cfg.iv}&startTime=${Math.floor(s)}&limit=1000`));
  const parts = await Promise.all(jobs);
  const seen = new Set(), out = [];
  for (const a of parts) for (const k of a) { if (seen.has(k[0])) continue; seen.add(k[0]); out.push({ t: k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4] }); }
  out.sort((a, b) => a.t - b.t);
  if (out.length < 50) throw new Error('too few');
  return out;
}
async function fromCryptoCompare(sym, tl){
  const cfg = TL[tl], need = Math.ceil(cfg.days * 864e5 / cfg.ccMs);
  let toTs = Math.floor(Date.now() / 1000), out = [];
  while (out.length < need) {
    const lim = Math.min(2000, need - out.length);
    const j = await fetchJSON(`https://min-api.cryptocompare.com/data/v2/${cfg.cc}?fsym=${sym}&tsym=USD&limit=${lim}&toTs=${toTs}`);
    const arr = (j.Data && j.Data.Data || []).filter(d => d.open > 0 && d.close > 0);
    if (!arr.length) break;
    out = arr.map(d => ({ t: d.time * 1000, o: d.open, h: d.high, l: d.low, c: d.close })).concat(out);
    toTs = arr[0].time - 1;
    if (arr.length < lim) break;
  }
  if (out.length < 50) throw new Error('too few');
  return out;
}
function demoData(sym, tl){
  const cfg = TL[tl], tok = TOKENS.find(t => t.s === sym) || TOKENS[0];
  const n = Math.floor(cfg.days * 864e5 / cfg.ms);
  const rnd = mulberry(sym.length * 991 + n);
  const g = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const dt = cfg.ms / 864e5 / 365, vol = 0.75;
  let p = tok.p * 0.55, t = Date.now() - n * cfg.ms, out = [], drift = 0;
  for (let i = 0; i < n; i++) {
    if (i % Math.floor(n / 9) === 0) drift = (rnd() - 0.35) * 2.4;
    const o = p, sub = 4; let h = o, l = o;
    for (let k = 0; k < sub; k++) { p *= Math.exp((drift - vol * vol / 2) * dt / sub + vol * Math.sqrt(dt / sub) * g()); h = Math.max(h, p); l = Math.min(l, p); }
    out.push({ t, o, h: h * (1 + rnd() * 0.002), l: l * (1 - rnd() * 0.002), c: p }); t += cfg.ms;
  }
  return out;
}
async function loadBase(sym, tl){
  const key = sym + tl;
  if (cache[key]) return cache[key];
  const tries = [
    ['Binance', () => fromBinance('https://api.binance.com', sym, tl)],
    ['Binance', () => fromBinance('https://data-api.binance.vision', sym, tl)],
    ['CryptoCompare', () => fromCryptoCompare(sym, tl)]
  ];
  for (const [name, fn] of tries) {
    try { const d = await fn(); return cache[key] = { d, src: name, live: true }; } catch (e) { /* next */ }
  }
  return cache[key] = { d: demoData(sym, tl), src: 'Demo data (offline — APIs unreachable)', live: false };
}
function aggregate(base, a, b, N){
  const len = b - a; N = Math.max(1, Math.min(N, len));
  const out = [];
  for (let k = 0; k < N; k++) {
    const i0 = a + Math.floor(k * len / N), i1 = Math.max(i0 + 1, a + Math.floor((k + 1) * len / N));
    let h = -Infinity, l = Infinity;
    for (let i = i0; i < i1; i++) { if (base[i].h > h) h = base[i].h; if (base[i].l < l) l = base[i].l; }
    out.push({ t: base[i0].t, o: base[i0].o, h, l, c: base[i1 - 1].c });
  }
  return out;
}

// ---------- strategy (hindsight swing trader on real candles) ----------
function zigzag(c, th){
  const piv = []; let dir = 0, minI = 0, maxI = 0;
  for (let i = 1; i < c.length; i++) {
    if (dir === 0) {
      if (c[i] < c[minI]) minI = i; if (c[i] > c[maxI]) maxI = i;
      if (c[i] >= c[minI] * (1 + th)) { piv.push({ i: minI, t: 'L' }); dir = 1; maxI = i; }
      else if (c[i] <= c[maxI] * (1 - th)) { piv.push({ i: maxI, t: 'H' }); dir = -1; minI = i; }
    } else if (dir === 1) {
      if (c[i] > c[maxI]) maxI = i; else if (c[i] <= c[maxI] * (1 - th)) { piv.push({ i: maxI, t: 'H' }); dir = -1; minI = i; }
    } else {
      if (c[i] < c[minI]) minI = i; else if (c[i] >= c[minI] * (1 + th)) { piv.push({ i: minI, t: 'L' }); dir = 1; maxI = i; }
    }
  }
  if (dir === 1 && maxI > (piv.length ? piv[piv.length - 1].i : -1) + 1) piv.push({ i: maxI, t: 'H' });
  return piv;
}
// Simulated trade history across the whole loaded timeline (stands in for the user's real trades).
// The card shows only the trades that fall inside the selected period.
function buildHistory(){
  const b = S.base, n = b.length; if (!n) { S.hist = []; return; }
  const B = Math.min(n, 700), agg = aggregate(b, 0, n, B), closes = agg.map(k => k.c);
  const target = S.trades * 2;
  let lo = 0.002, hi = 3;
  for (let it = 0; it < 40; it++) { const mid = Math.sqrt(lo * hi); if (zigzag(closes, mid).length > target) lo = mid; else hi = mid; }
  const piv = zigzag(closes, hi);
  S.hist = piv.map(p => {
    const i0 = Math.floor(p.i * n / B), i1 = Math.max(i0 + 1, Math.floor((p.i + 1) * n / B));
    let bi = i0; for (let i = i0; i < i1; i++) if (p.t === 'L' ? b[i].c < b[bi].c : b[i].c > b[bi].c) bi = i;
    return { i: bi, t: p.t };
  });
}
function buildModel(candles){
  const N = candles.length;
  const [ra, rb] = S.range, rlen = rb - ra;
  let piv = [];
  for (const h of S.hist || []) {
    if (h.i < ra || h.i >= rb) continue;
    const k = Math.min(N - 1, Math.floor((h.i - ra) * N / rlen));
    const last = piv[piv.length - 1];
    if (last && last.t === h.t) continue;
    if (last && last.i === k) { piv.pop(); continue; }
    piv.push({ i: k, t: h.t });
  }
  while (piv.length && piv[0].t === 'H') piv.shift();

  const fills = []; // per candle index
  let cash = S.capital, hold = 0, cost = 0, bought = 0, sold = 0, bQty = 0, sQty = 0;
  const after = []; const byIdx = new Map();
  for (let pi = 0; pi < piv.length; pi++) {
    const p = piv[pi], nextI = pi + 1 < piv.length ? piv[pi + 1].i : N;
    const plan = [[p.i, 0.6, true]]; if (p.i + 1 < nextI && p.i + 1 < N) plan.push([p.i + 1, 1, false]); else plan[0][1] = 1;
    for (const [i, frac, main] of plan) { if (!byIdx.has(i)) byIdx.set(i, []); byIdx.get(i).push({ side: p.t === 'L' ? 'B' : 'S', frac, main }); }
  }
  let firstProfit = null;
  for (let i = 0; i < N; i++) {
    const px = candles[i].c;
    for (const f of byIdx.get(i) || []) {

  $('rangeMeta').textContent = `${len.toLocaleString()} × ${tl.iv} source candles → ${eff} candles · 1 candle ≈ ${perTxt}`;
  $('candlesInfo').textContent = eff < S.N ? `(${eff} max for this period)` : '';
}
(() => {
  let mode = null, sx = 0, sr = null;
  const minLen = () => Math.min(S.base.length, Math.max(S.N, 10));
  track.addEventListener('pointerdown', e => {
    if (!S.base.length) return;
    mode = e.target === $('hL') ? 'l' : e.target === $('hR') ? 'r' : e.target === win ? 'm' : 'jump';
    sx = e.clientX; sr = [...S.range];
    if (mode === 'jump') {
      const rect = track.getBoundingClientRect(), n = S.base.length, len = sr[1] - sr[0];
      const c = Math.round((e.clientX - rect.left) / rect.width * n);
      let a = clamp(c - Math.floor(len / 2), 0, n - len); S.range = [a, a + len]; sr = [...S.range]; mode = 'm';
      layoutRange(); scheduleBuild();
    }
    track.setPointerCapture(e.pointerId);
  });
  track.addEventListener('pointermove', e => {
    if (!mode) return;
    const rect = track.getBoundingClientRect(), n = S.base.length, d = Math.round((e.clientX - sx) / rect.width * n);
    let [a, b] = sr;
    if (mode === 'l') a = clamp(a + d, 0, b - minLen());
    else if (mode === 'r') b = clamp(b + d, a + minLen(), n);
    else { const len = b - a; a = clamp(a + d, 0, n - len); b = a + len; }
    S.range = [a, b]; layoutRange(); scheduleBuild();
  });
  const up = () => { mode = null; };
  track.addEventListener('pointerup', up); track.addEventListener('pointercancel', up);
})();

// ---------- controls ----------
let buildTimer = null;
function scheduleBuild(){ clearTimeout(buildTimer); buildTimer = setTimeout(build, 90); }
function build(){
  if (!S.base.length) return;
  const [a, b] = S.range;
  const candles = aggregate(S.base, a, b, S.N);
  S.model = buildModel(candles);
  saveSettings();
  if (!S.recording) play(0);
}
const LS_KEY = 'velvet-pnl-card:v1';
let pendingRange = null, lastSaved = null;
function saveSettings(){
  try {
    const n = S.base.length, [a, b] = S.range;
    const json = JSON.stringify({
      token: S.token, tl: S.tl, N: S.N, D: S.D, trades: S.trades, boost: S.boost, capital: S.capital, loop: S.loop,
      range: n && b > a ? { tl: S.tl, startT: S.base[a].t, endT: S.base[b - 1].t, len: b - a, atEnd: b === n } : (lastSaved && lastSaved.range) || null
    });
    lastSaved = JSON.parse(json);
    try { localStorage.setItem(LS_KEY, json); } catch (e) {}
    try { history.replaceState(null, '', '#s=' + encodeURIComponent(json)); } catch (e) { try { location.hash = 's=' + encodeURIComponent(json); } catch (e2) {} }
  } catch (e) {}
}
function restoreSettings(){
  let d = null;
  try { const m = location.hash.match(/s=([^&]+)/); if (m) d = JSON.parse(decodeURIComponent(m[1])); } catch (e) {}
  if (!d) try { d = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  lastSaved = d;
  if (!d) return;
  if (TOKENS.some(t => t.s === d.token)) S.token = d.token;
  if (TL[d.tl]) S.tl = d.tl;
  for (const k of ['N', 'D', 'trades', 'boost', 'capital']) if (isFinite(d[k])) S[k] = +d[k];
  if (typeof d.loop === 'boolean') S.loop = d.loop;
  if (d.range && d.range.tl === S.tl) pendingRange = d.range;
  // reflect in UI
  const pairs = { N: ['candlesR', 'candles'], D: ['durR', 'dur'], trades: ['tradesR', 'trades'], boost: ['boostR', 'boost'] };
  for (const k in pairs) pairs[k].forEach(id => $(id).value = S[k]);
  $('capital').value = S.capital;
  document.querySelectorAll('#tl button').forEach(b => b.classList.toggle('on', b.dataset.v === S.tl));
  document.querySelectorAll('#loop button').forEach(b => b.classList.toggle('on', (b.dataset.v === '1') === S.loop));
}
function applyPendingRange(){
  const r = pendingRange, n = S.base.length; pendingRange = null;
  if (!r || !n) return false;
  const minLen = Math.min(n, Math.max(S.N, 10));
  let a, b;
  if (r.atEnd) { b = n; a = clamp(n - r.len, 0, n - minLen); }
  else {
    const idx = t => { let lo = 0, hi = n - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (S.base[m].t < t) lo = m + 1; else hi = m; } return lo; };
    a = idx(r.startT); b = Math.min(n, idx(r.endT) + 1);
    if (b - a < minLen) { a = clamp(b - minLen, 0, n - minLen); b = a + minLen; }
  }
  S.range = [a, b]; return true;
}
function bindPair(rid, nid, key, parse = parseFloat){
  const r = $(rid), n = $(nid);
  const set = v => { v = parse(v); if (!isFinite(v)) return; S[key] = v; r.value = v; n.value = v; if (key === 'N') layoutRange(); saveSettings(); scheduleBuild(); };
  r.oninput = () => set(r.value); n.onchange = () => set(clamp(parse(n.value), +n.min, +n.max));
}
bindPair('candlesR', 'candles', 'N', v => Math.round(+v));
bindPair('durR', 'dur', 'D');
bindPair('tradesR', 'trades', 'trades', v => Math.round(+v));
$('tradesR').addEventListener('input', () => { buildHistory(); drawSpark(); });
$('trades').addEventListener('change', () => { buildHistory(); drawSpark(); });
bindPair('boostR', 'boost', 'boost');
$('capital').onchange = e => { S.capital = Math.max(100, +e.target.value || 10000); saveSettings(); scheduleBuild(); };
const tokSel = $('token');
TOKENS.forEach(t => { const o = document.createElement('option'); o.value = t.s; o.textContent = t.s; tokSel.appendChild(o); });
tokSel.value = S.token;
tokSel.onchange = () => { S.token = tokSel.value; saveSettings(); loadAndBuild(true); };
document.querySelectorAll('#tl button').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('#tl button').forEach(b => b.classList.toggle('on', b === btn));
  S.tl = btn.dataset.v; loadAndBuild(true);
});
document.querySelectorAll('#loop button').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('#loop button').forEach(b => b.classList.toggle('on', b === btn));
  S.loop = btn.dataset.v === '1'; saveSettings();
});
addEventListener('resize', () => { drawSpark(); });

async function loadAndBuild(resetRange){
  $('loading').hidden = false; $('loading').textContent = `Loading ${S.token} prices…`;
  const res = await loadBase(S.token, S.tl);
  S.base = res.d; buildHistory();
  $('srcDot').className = 'dot ' + (res.live ? 'live' : 'demo');
  $('srcText').textContent = res.live ? `${res.src} · ${S.token}/USDT · ${TL[S.tl].iv} · live` : res.src;
  const n = S.base.length;
  if (applyPendingRange()) {} else if (resetRange || !S.range[1] || S.range[1] > n) { const len = Math.max(Math.min(n, S.N), Math.round(n * TL[S.tl].def)); S.range = [n - len, n]; }
  $('loading').hidden = true;
  drawSpark(); layoutRange(); build();
}

// ---------- boot ----------
(async () => {
  await Promise.all(['bg', 'gift', 'logo', 'eth'].map(loadImg));
  try { await Promise.all(['500 70px Poppins, sans-serif', '600 70px Poppins, sans-serif', '700 70px Poppins, sans-serif', '800 70px Poppins, sans-serif', '600 60px Inter, sans-serif'].map(f => document.fonts.load(f))); } catch (e) {}
  restoreSettings(); tokSel.value = S.token;
  requestAnimationFrame(frame);
  loadAndBuild(true);
})();
})();
</script>
</body>
